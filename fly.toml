# Fly.io config. Deploy with:  fly launch --copy-config --now   (then `fly deploy`)
# Builds from the Dockerfile. WebSockets work over Fly's proxy.
app = "human-error"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
