[package]
name = "human-error"
version = "0.2.0"
description = "HUMAN ERROR — hide-in-the-crowd party game (desktop wrapper)"
edition = "2021"

[lib]
name = "human_error_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "5"
open = "5"

[profile.release]
strip = true
lto = true
codegen-units = 1
